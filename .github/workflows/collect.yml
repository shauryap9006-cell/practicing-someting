name: RailTwin-X Scheduled Corridor Collector

on:
  schedule:
    # Runs 4 times a day: 06:00, 12:00, 18:00, 00:00 IST (00:30, 06:30, 12:30, 18:30 UTC)
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Corridor Collector
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python -m collector.collect

      - name: Publish collector output as a short-lived artifact
        run: |
          test -f data/railtwin.db

      - name: Upload collector snapshot for controlled ingestion
        uses: actions/upload-artifact@v4
        with:
          name: corridor-collector-${{ github.run_id }}
          path: data/railtwin.db
          retention-days: 7
