services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: railtwin-x:v4
    container_name: railtwin_api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - RAILTWIN_DB_PATH=/app/data/railtwin.db
      - RAILTWIN_ARTIFACTS_DIR=/app/ml/artifacts
      - RAILTWIN_API_HOST=0.0.0.0
      - RAILTWIN_API_PORT=8000
      - RAILTWIN_UVICORN_WORKERS=1
      - RAILTWIN_ENV=${RAILTWIN_ENV:-development}
      - RAILTWIN_JWT_SECRET_KEY=${RAILTWIN_JWT_SECRET_KEY}
      - RAILTWIN_CORS_ORIGINS=${RAILTWIN_CORS_ORIGINS:-["http://localhost:5173","http://localhost:8000"]}
      - RAILTWIN_DEFAULT_STATION_CODE=${RAILTWIN_DEFAULT_STATION_CODE:-NDLS}
      - RAILTWIN_DEFAULT_JUNCTION_CODE=${RAILTWIN_DEFAULT_JUNCTION_CODE:-CNB}
    volumes:
      - railtwin_db:/app/data
      - railtwin_cache:/app/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  railtwin_db:
  railtwin_cache:
